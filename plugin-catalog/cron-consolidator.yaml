name: cron-consolidator
title: Cron Consolidator
repo: https://github.com/Moodtuner997/hermes-cron-consolidator
sha: afe04999ad0a772ab263eaef3013cbb7c1f9e6b1
version: "0.1.3"
description: "A read-only plan for tidying a crowded cron list: groups jobs whose prompts are near-duplicates or that share skills and destination or run the same script (candidates to become one job), lists clock-time jobs that fire in the same minute, jobs on a failure streak and deliveries never confirmed, and estimates the prompt tokens a merge could save from usage_audit.jsonl. Deterministic (difflib, no model call); nothing is applied. Disclosure — no network; reads cron/jobs.json (including prompts, compared but never printed), cron/usage_audit.jsonl and cron/executions.db (opened read-only; immutable when Hermes is not running, so SQLite leaves no -wal or -shm file beside it) of the chosen profile, and with --profile NAME (a Hermes profile name, never a path) another profile's cron folder under the same Hermes root, or, from the shell only, with --home the cron folder of any path given (the slash command refuses --home); the report (job names, schedules, delivery targets, up to 160 characters of a failing job's last error) is shown wherever the command runs, including messaging-gateway chats, where no message of the plugin carries a path of the machine and any word of a job's last error holding a path separator is masked, and an unreadable executions.db is reported as a warning; writes nothing; runs no shell command and no background process; registers no hook, tool or middleware, only a slash command and a CLI command; no telemetry."
maintainer: Moodtuner997
tier: community
category: tools
requires_hermes: ">=0.22.7"
docs_url: https://github.com/Moodtuner997/hermes-cron-consolidator#readme
readme: true
platforms: [linux, macos, windows]
